name: PROBE price sources

# Throwaway diagnostic. Run manually, read the log, then delete this file.
# Purpose: find out what a real GitHub-hosted runner IP actually gets back
# from each candidate price source. Never fails, so every source is tested
# even if earlier ones error out.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe all candidate sources
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          probe() {
            LABEL="$1"; URL="$2"; USE_UA="$3"
            echo "=============================================================="
            echo "PROBE: $LABEL"
            echo "URL:   $URL"
            echo "UA:    $USE_UA"
            echo "--------------------------------------------------------------"
            if [ "$USE_UA" = "yes" ]; then
              curl -sSL --max-time 20 -A "$UA" \
                -w '\n---\nHTTP_STATUS: %{http_code}\nSIZE: %{size_download} bytes\nTIME: %{time_total}s\n' \
                "$URL" 2>&1 | head -c 1200 || echo "CURL_EXIT: $?"
            else
              curl -sSL --max-time 20 \
                -w '\n---\nHTTP_STATUS: %{http_code}\nSIZE: %{size_download} bytes\nTIME: %{time_total}s\n' \
                "$URL" 2>&1 | head -c 1200 || echo "CURL_EXIT: $?"
            fi
            echo
          }

          echo "Runner egress IP:"
          curl -sS --max-time 10 https://api.ipify.org || echo "(could not determine)"
          echo; echo

          # --- The current source, with and without a browser UA -------------
          probe "stooq gold, default curl UA" \
            "https://stooq.com/q/l/?s=xauusd&f=sd2t2ohlcv&h&e=csv" "no"

          probe "stooq gold, browser UA" \
            "https://stooq.com/q/l/?s=xauusd&f=sd2t2ohlcv&h&e=csv" "yes"

          probe "stooq silver, browser UA" \
            "https://stooq.com/q/l/?s=xagusd&f=sd2t2ohlcv&h&e=csv" "yes"

          # --- Candidate fallbacks, no API key required ---------------------
          probe "goldprice.org (both metals, one call)" \
            "https://data-asg.goldprice.org/dbXRates/USD" "yes"

          probe "gold-api.com gold" \
            "https://api.gold-api.com/price/XAU" "yes"

          probe "gold-api.com silver" \
            "https://api.gold-api.com/price/XAG" "yes"

          # --- Yahoo futures, likely gated now but cheap to check -----------
          probe "yahoo GC=F gold futures" \
            "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1d&range=1d" "yes"

          probe "yahoo SI=F silver futures" \
            "https://query1.finance.yahoo.com/v8/finance/chart/SI=F?interval=1d&range=1d" "yes"

          echo "=============================================================="
          echo "Probe complete. This job always exits 0."
